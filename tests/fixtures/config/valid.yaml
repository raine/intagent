version: 1
project_roots:
  - ~/code
state:
  database: ~/.config/intagent/state/intagent.sqlite
skills:
  directories:
    - ./skills
  approved_roots:
    - ./skills
    - ~/.claude/skills
sources:
  - name: fastmail
    command: intagent-fastmail-source
    interval_seconds: 60
    timeout_seconds: 45
    item_limit: 100
    environment:
      - FASTMAIL_API_TOKEN
    options:
      mailbox_id: inbox
      include_headers:
        X-GitHub-Reason:
          - comment
          - subscribed
  - name: github
    command: intagent-github-source
    environment:
      - GITHUB_TOKEN
    options: {}
triage:
  model: gpt-5.6-luna
  thinking_level: max
  max_turns: 50
  timeout_minutes: 30
  max_attempts: 3
  retry_base_seconds: 60
commands:
  path:
    - /opt/homebrew/bin
    - /usr/local/bin
    - /usr/bin
    - /bin
  timeout_seconds: 60
  max_output_bytes: 65536
  sensitive_patterns: []
  rules:
    - executable: aven
    - executable: workmux
    - executable: git
    - executable: rg
