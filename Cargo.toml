[package]
name = "personal-intake"
version = "0.1.0"
edition = "2024"
description = "Local intake monitor with restricted agent triage"
license = "MIT"

[lib]
name = "intake"
path = "src/lib.rs"

[[example]]
name = "rig-compat"
path = "examples/rig-compat.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
libc = "0.2"
regex = "1"
rig-agent = { git = "https://github.com/0xPlaygrounds/rig", rev = "1f9547774edb4c269be991ac42eb043fd7b6e87f" }
rig-core = { git = "https://github.com/0xPlaygrounds/rig", rev = "1f9547774edb4c269be991ac42eb043fd7b6e87f" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "=1.0.1"
serde_json = "1"
thiserror = "2"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"
url = "2"
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
http = "1"
rig-agent = { git = "https://github.com/0xPlaygrounds/rig", rev = "1f9547774edb4c269be991ac42eb043fd7b6e87f", features = [
  "test-utils",
] }
rig-core = { git = "https://github.com/0xPlaygrounds/rig", rev = "1f9547774edb4c269be991ac42eb043fd7b6e87f", features = [
  "test-utils",
] }
tempfile = "3"

[patch."https://github.com/0xPlaygrounds/rig"]
rig-agent = { path = "vendor/rig/crates/rig-agent" }
rig-core = { path = "vendor/rig/crates/rig-core" }
rig-derive = { path = "vendor/rig/crates/rig-derive" }
