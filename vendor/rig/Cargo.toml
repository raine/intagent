[workspace]
resolver = "3"
members = ["crates/rig-agent", "crates/rig-core", "crates/rig-derive"]

[workspace.package]
version = "0.41.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
as-any = "0.3.2"
assert_fs = "1.1.3"
async-stream = "0.3.6"
base64 = "0.22.1"
bytes = "1.10.1"
convert_case = "0.11.0"
epub = "2.1.4"
eventsource-stream = "0.2.3"
fastrand = "2.3.0"
futures = "0.3.32"
futures-timer = "3.0.3"
glob = "0.3.2"
http = "1.3.1"
indexmap = "2.14.0"
lopdf = "0.41.0"
mime = "0.3.17"
mime_guess = "2.0.5"
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry_sdk = "0.32.1"
ordered-float = "5.0.0"
pin-project-lite = "0.2.16"
proc-macro2 = "1.0.95"
quick-xml = "0.40.1"
quote = "1.0.40"
rayon = "1.10.0"
redis = "1.2.1"
rmcp = "2.2.0"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { version = "0.5.2", default-features = false }
reqwest-retry = "0.9"
schemars = "1.0.4"
serde = "1.0.219"
serde_json = "1.0.150"
serde_path_to_error = "0.1.17"
serenity = "0.12.4"
syn = "2.0.104"
thiserror = "2.0.12"
tokio = "1.52.3"
tokio-test = "0.4.4"
tokio-tungstenite = { version = "0.30.0", default-features = false }
tracing = "0.1.41"
tracing-futures = "0.2.5"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = "0.3.19"
url = "2.5"

[workspace.lints.clippy]
dbg_macro = "forbid"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "deny"
expect_fun_call = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "forbid"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"
