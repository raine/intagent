name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: intagent-linux-x64
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: intagent-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust 1.97.1
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup default 1.97.1
          rustup target add "$TARGET"
      - name: Install musl compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: scripts/install-checkle
        env:
          CHECKLE_INSTALL_DIR: ${{ runner.temp }}/checkle-bin
      - name: Install just
        run: cargo install just --locked --version 1.58.0
      - run: npm ci --prefix web
      - run: just check-ci
      - name: Build release archive
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cargo build --release --locked --bins --target "$TARGET"
          mkdir -p "$ARCHIVE/bin" "$ARCHIVE/share/doc/intagent/examples"
          cp "target/$TARGET/release/intagent" "$ARCHIVE/bin/"
          cp "target/$TARGET/release/intagent-fastmail-source" "$ARCHIVE/bin/"
          cp "target/$TARGET/release/intagent-github-source" "$ARCHIVE/bin/"
          cp -R examples/skills "$ARCHIVE/share/doc/intagent/examples/skills"
          cp LICENSE "$ARCHIVE/"
          for executable in intagent intagent-fastmail-source intagent-github-source; do
            "$ARCHIVE/bin/$executable" --help >/dev/null
            file "$ARCHIVE/bin/$executable"
            if [[ "$TARGET" == *-linux-* ]]; then
              ldd "$ARCHIVE/bin/$executable" 2>&1 | tee dependencies.txt || true
            else
              otool -L "$ARCHIVE/bin/$executable" | tee dependencies.txt
            fi
            if grep -Eiq '(^|[/[:space:]])(bun|libnode|node)([./[:space:]]|$)' dependencies.txt; then
              exit 1
            fi
          done
          rm -f dependencies.txt
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3
        with:
          draft: true
          files: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256
