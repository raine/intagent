name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: personal-intake-linux-x64
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: personal-intake-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust 1.94.0
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup default 1.94.0
          rustup target add "$TARGET"
      - name: Install musl compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: scripts/install-checkle
        env:
          CHECKLE_INSTALL_DIR: ${{ runner.temp }}/checkle-bin
      - name: Install just
        run: cargo install just --locked --version 1.45.0
      - run: npm ci --prefix web
      - run: just check-ci
      - name: Build release archive
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          cargo build --release --locked --bins --target "$TARGET"
          mkdir -p "$ARCHIVE/bin" "$ARCHIVE/share/intake"
          cp "target/$TARGET/release/intake" "$ARCHIVE/bin/"
          cp "target/$TARGET/release/intake-fastmail-source" "$ARCHIVE/bin/"
          cp "target/$TARGET/release/intake-github-source" "$ARCHIVE/bin/"
          cp -R skills "$ARCHIVE/share/intake/skills"
          cp LICENSE "$ARCHIVE/"
          for executable in intake intake-fastmail-source intake-github-source; do
            "$ARCHIVE/bin/$executable" --help >/dev/null
            file "$ARCHIVE/bin/$executable"
            if [[ "$TARGET" == *-linux-* ]]; then
              ldd "$ARCHIVE/bin/$executable" 2>&1 | tee dependencies.txt || true
            else
              otool -L "$ARCHIVE/bin/$executable" | tee dependencies.txt
            fi
            if grep -Eiq '(^|[/[:space:]])(bun|libnode|node)([./[:space:]]|$)' dependencies.txt; then
              exit 1
            fi
          done
          rm -f dependencies.txt
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256
