name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64-modern
            archive: personal-intake-linux-x64
          - runner: macos-14
            target: bun-darwin-arm64
            archive: personal-intake-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Compile executables
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir "$ARCHIVE"
          bun build --compile --target="$TARGET" src/cli.ts --outfile "$ARCHIVE/intake"
          bun build --compile --target="$TARGET" src/sources/fastmail.ts --outfile "$ARCHIVE/intake-fastmail-source"
          bun build --compile --target="$TARGET" src/sources/github.ts --outfile "$ARCHIVE/intake-github-source"
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            ${{ matrix.archive }}.tar.gz
            ${{ matrix.archive }}.tar.gz.sha256
