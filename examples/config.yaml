version: 1
project_roots:
  - ~/code
state:
  database: ~/.config/intake/state/intake.sqlite
skills:
  directories:
    - ./skills
    - ~/.config/intake/skills
  approved_roots:
    - ./skills
    - ~/.config/intake/skills
    - ~/.claude/skills
sources:
  - name: fastmail
    command: intake-fastmail-source
    interval_seconds: 60
    timeout_seconds: 60
    item_limit: 100
    environment:
      - FASTMAIL_API_TOKEN
    options: {}
  - name: github
    command: intake-github-source
    interval_seconds: 60
    timeout_seconds: 60
    item_limit: 100
    environment:
      - GITHUB_TOKEN
    options: {}
triage:
  max_turns: 50
  timeout_minutes: 30
  max_attempts: 3
  retry_base_seconds: 60
commands:
  path:
    - /opt/homebrew/bin
    - /usr/local/bin
    - /usr/bin
    - /bin
  timeout_seconds: 60
  max_output_bytes: 65536
  sensitive_patterns: []
  rules:
    - executable: aven
    - executable: workmux
    - executable: tmux
    - executable: git
    - executable: rg
    - executable: fd
