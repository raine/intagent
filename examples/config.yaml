version: 1
projectRoots:
  - ~/code
state:
  database: ~/.config/intake/state/intake.sqlite
skills:
  directories:
    - ./skills
    - ~/.config/intake/skills
  approvedRoots:
    - ./skills
    - ~/.config/intake/skills
    - ~/.claude/skills
sources:
  - name: fastmail
    command: intake-fastmail-source
    intervalSeconds: 60
    timeoutSeconds: 60
    itemLimit: 100
    environment:
      - FASTMAIL_API_TOKEN
    options: {}
  - name: github
    command: intake-github-source
    intervalSeconds: 60
    timeoutSeconds: 60
    itemLimit: 100
    environment:
      - GITHUB_TOKEN
    options: {}
triage:
  maxTurns: 50
  timeoutMinutes: 30
  maxAttempts: 3
  retryBaseSeconds: 60
commands:
  path:
    - /opt/homebrew/bin
    - /usr/local/bin
    - /usr/bin
    - /bin
  timeoutSeconds: 60
  maxOutputBytes: 65536
  sensitivePatterns: []
  rules:
    - executable: aven
      subcommands: [list, search, show, context, add, note, prime]
      allowedFlags:
        - --project
        - --status
        - --priority
        - --label
        - --open
        - --ready
        - --blocked
        - --limit
        - --json
        - --full
        - --description
        - --workspace
      valueFlags:
        - --project
        - --status
        - --priority
        - --label
        - --limit
        - --description
        - --workspace
      minPositionals: 0
      maxPositionals: 20
    - executable: workmux
      subcommands: [status, list, path, add]
      allowedFlags:
        [--json, --pr, --auto-name, -A, --background, -b, --prompt, -p, --base]
      valueFlags: [--pr, --prompt, -p, --base]
      minPositionals: 0
      maxPositionals: 4
    - executable: tmux
      subcommands: [list-sessions, list-windows, has-session]
      allowedFlags: [-F, -t]
      valueFlags: [-F, -t]
      minPositionals: 0
      maxPositionals: 0
    - executable: git
      subcommands: [remote, status, branch, rev-parse, config]
      allowedFlags: [-C, --get, --show-toplevel, --porcelain, --format]
      valueFlags: [-C, --get, --format]
      minPositionals: 0
      maxPositionals: 4
    - executable: rg
      allowedFlags:
        [-n, --line-number, -l, --files, -g, --glob, -F, --fixed-strings]
      valueFlags: [-g, --glob]
      minPositionals: 0
      maxPositionals: 10
    - executable: fd
      allowedFlags: [-H, --hidden, -t, --type, -d, --max-depth]
      valueFlags: [-t, --type, -d, --max-depth]
      minPositionals: 0
      maxPositionals: 4
