version: 1
projectRoots:
  - ~/code
state:
  database: ~/.config/intake/state/intake.sqlite
skills:
  directories:
    - ./skills
    - ~/.config/intake/skills
  approvedRoots:
    - ./skills
    - ~/.config/intake/skills
    - ~/.claude/skills
sources:
  - name: fastmail
    command: intake-fastmail-source
    intervalSeconds: 60
    timeoutSeconds: 60
    itemLimit: 100
    environment:
      - FASTMAIL_API_TOKEN
    options: {}
  - name: github
    command: intake-github-source
    intervalSeconds: 60
    timeoutSeconds: 60
    itemLimit: 100
    environment:
      - GITHUB_TOKEN
    options: {}
triage:
  maxTurns: 50
  timeoutMinutes: 30
  maxAttempts: 3
  retryBaseSeconds: 60
commands:
  path:
    - /opt/homebrew/bin
    - /usr/local/bin
    - /usr/bin
    - /bin
  timeoutSeconds: 60
  maxOutputBytes: 65536
  sensitivePatterns: []
  rules:
    - executable: aven
    - executable: workmux
    - executable: tmux
    - executable: git
    - executable: rg
    - executable: fd
