version: 1
project_roots:
  - ~/code
state:
  database: ~/.local/state/intagent/intagent.sqlite
  # Per-attempt JSONL files and application.log live here.
  logs: ~/.local/state/intagent/logs
skills:
  directories:
    - ~/.config/intagent/skills
  approved_roots:
    - ~/.config/intagent/skills
    - ~/.claude/skills
sources:
  - name: fastmail
    command: intagent-fastmail-source
    interval_seconds: 60
    timeout_seconds: 60
    item_limit: 100
    environment:
      - FASTMAIL_API_TOKEN
    options:
      mailbox_id: inbox
      # Header names map to case-insensitive values. Every include rule must
      # match. Exclude rules use the same mapping and reject matches. Filtered
      # messages are omitted from events and later thread context.
      include_headers:
        X-GitHub-Reason:
          - comment
          - subscribed
      # GitHub Message-IDs identify the notification resource type.
      include_message_id_contains:
        - /issues/
        - /pull/
  - name: github
    command: intagent-github-source
    interval_seconds: 60
    timeout_seconds: 60
    item_limit: 100
    environment:
      - GITHUB_TOKEN
    options: {}
triage:
  model: gpt-5.6-luna
  thinking_level: max
  max_turns: 50
  timeout_minutes: 30
  max_attempts: 3
  retry_base_seconds: 60
  compaction_trigger_tokens: 100000
  compaction_keep_recent_messages: 12
commands:
  path:
    - /opt/homebrew/bin
    - /usr/local/bin
    - /usr/bin
    - /bin
  timeout_seconds: 60
  max_output_bytes: 65536
  sensitive_patterns: []
  rules:
    - executable: git
    - executable: rg
    - executable: fd
