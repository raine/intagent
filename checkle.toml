[[check]]
name = "rust-format"
mode = "rustfmt"
command = ["cargo", "fmt", "--all", "--", "--check"]

[[check]]
name = "rust-clippy"
mode = "cargo"
command = [
  "cargo",
  "clippy",
  "--all-targets",
  "--message-format=json",
  "--",
  "-D",
  "warnings",
]

[[check]]
name = "rust-test"
mode = "cargo"
command = ["cargo", "test", "--all-targets", "--message-format=json"]

[[check]]
name = "rust-release"
mode = "cargo"
command = ["cargo", "build", "--release", "--locked", "--message-format=json"]

[[check]]
name = "browser"
command = [
  "bash",
  "-c",
  "npm ci --prefix web && npm run format:check --prefix web && npm run lint --prefix web && npm run typecheck --prefix web && npm test --prefix web && npm run build --prefix web && git diff --exit-code -- web/generated web/src/api-types.ts",
]

[[check]]
name = "package"
command = ["scripts/package-check"]

[[check]]
name = "scripts"
command = [
  "bash",
  "-c",
  "bash -n hooks/pre-commit scripts/install scripts/install-checkle scripts/install-git-hook-shims scripts/package-check && shellcheck hooks/pre-commit scripts/install scripts/install-checkle scripts/install-git-hook-shims scripts/package-check",
]

[[group]]
name = "project"
checks = [
  "rust-format",
  "rust-clippy",
  "rust-test",
  "rust-release",
  "browser",
  "package",
  "scripts",
]
